[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eva"
version = "0.1.0"
description = "EVA — распределённая локальная ИИ-система"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11,<4",
    "aiohttp-swagger3>=0.10,<1",
    "jsonschema[format]>=4.23,<5"
]

[tool.setuptools.packages.find]
where = ["src"]